<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0b">
<title>TETSTACK — Log</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<script>try{if(localStorage.getItem('tetstack-theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<link rel="stylesheet" href="/assets/tetstack.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
.read-progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:95;background:var(--ghost)}
.read-progress-fill{height:100%;width:0;background:var(--steel);box-shadow:0 0 12px rgba(247,245,234,.45)}
.post-wrap{padding-top:clamp(110px,15vh,150px)}
.back{display:inline-flex;gap:10px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:34px;transition:color .3s,gap .3s}
.back:hover{color:var(--silver);gap:14px}
.log-head{max-width:980px;margin-bottom:clamp(40px,6vh,64px)}
.log-title{font-size:clamp(30px,4vw,60px);line-height:1.06}
.log-title em{font-size:1.06em}
.log-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:8px}
.log-meta .lcd-mini .seg{font-size:11px}
.log-tags{display:flex;flex-wrap:wrap;gap:6px}
.log-tag{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.log-tag.primary{color:var(--gold);border-color:rgba(199,163,70,.5)}
.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:clamp(36px,5vw,72px);align-items:start}
.article{padding:clamp(24px,4vw,56px)}
#post-content{font:400 19px/1.62 var(--f-s);color:var(--silver2);max-width:72ch;overflow-wrap:break-word}
#post-content > *:first-child{margin-top:0}
#post-content h1,#post-content h2,#post-content h3,#post-content h4{font-family:var(--f-d);font-weight:600;letter-spacing:-.02em;line-height:1.2;color:var(--silver);margin:46px 0 16px;scroll-margin-top:110px}
#post-content h1{font-size:clamp(22px,2.2vw,30px);padding-bottom:14px;border-bottom:1px solid var(--line)}
#post-content h2{font-size:clamp(19px,1.8vw,24px);padding-bottom:12px;border-bottom:1px solid var(--line)}
#post-content h3{font-size:16px}
#post-content h4{font-size:14px}
#post-content h2::before,#post-content h3::before{font:700 11px/1 var(--f-m);letter-spacing:.14em;color:var(--red);margin-right:12px;vertical-align:middle}
#post-content h2::before{content:'§'}
#post-content h3::before{content:'—'}
#post-content p{margin:0 0 20px}
#post-content a{color:var(--silver);border-bottom:1px solid var(--line-hi);transition:border-color .3s}
#post-content a:hover{border-color:var(--gold)}
#post-content strong{color:var(--silver);font-weight:400;font-family:var(--f-s);background:linear-gradient(transparent 62%,rgba(199,163,70,.28) 62%)}
#post-content em{font-style:italic;color:var(--silver)}
#post-content ul,#post-content ol{margin:0 0 22px;padding-left:24px}
#post-content li{margin-bottom:8px;padding-left:4px}
#post-content ul li::marker{color:var(--gold)}
#post-content ol li::marker{color:var(--gold);font:600 13px var(--f-m)}
#post-content blockquote{margin:0 0 24px;padding:16px 22px;border-left:2px solid var(--gold);background:var(--ghost);border-radius:0 10px 10px 0;font-style:italic}
#post-content blockquote p:last-child{margin-bottom:0}
#post-content code{font:400 .74em var(--f-m);color:var(--silver);background:var(--ghost);border:1px solid var(--line);border-radius:5px;padding:2px 6px;word-break:break-word}
#post-content pre{position:relative;margin:0 0 26px;padding:44px 18px 18px;border-radius:12px;background:linear-gradient(180deg,#1b1d1a,#0f100f);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(236,235,226,.12);overflow-x:auto;scrollbar-width:thin;line-height:1.7}
#post-content pre::before{content:'CODE';position:absolute;top:14px;left:18px;font:600 9px/1 var(--f-m);letter-spacing:.24em;color:rgba(236,235,226,.4)}
#post-content pre::after{content:'';position:absolute;top:14px;right:18px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(184,54,44,.8)}
#post-content pre code{font-size:13px;color:#e6e5dc;background:none;border:0;padding:0;word-break:normal}
#post-content hr{border:0;height:1px;background:var(--line);margin:40px 0}
#post-content img{max-width:100%;height:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
#post-content table{width:100%;border-collapse:collapse;margin:0 0 26px;font:400 12px/1.5 var(--f-m);display:block;overflow-x:auto}
#post-content th,#post-content td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
#post-content th{font-weight:600;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
#post-content .fatal{font:400 12px/1.6 var(--f-m);color:var(--red);letter-spacing:.06em}
.post-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:26px}
.read-lcd{padding:16px 18px}
.read-lcd .row{display:flex;justify-content:space-between;align-items:center}
.read-lcd b{font-size:30px;font-weight:400}
.read-bar{height:6px;margin-top:14px;border-radius:3px;background:rgba(28,33,27,.15);overflow:hidden}
.read-bar i{display:block;height:100%;width:0;background:var(--seg)}
.toc{padding:18px}
.toc-list{list-style:none;display:flex;flex-direction:column}
.toc-item{display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.4;color:var(--dim);transition:color .25s,padding .25s}
.toc-list li:last-child .toc-item{border-bottom:0}
.toc-item:hover,.toc-item.on{color:var(--silver);padding-left:6px}
.toc-item.on{box-shadow:inset 2px 0 0 var(--gold)}
.toc-item.is-sub{padding-left:16px;font-size:10.5px;color:var(--faint)}
.toc-item.is-sub:hover,.toc-item.is-sub.on{padding-left:22px}
.side-empty{font-size:11px;color:var(--faint)}
@media (max-width:1100px){.content-grid{grid-template-columns:1fr}.post-side{position:static;order:-1}.toc{display:none}}
@media (max-width:640px){#post-content{font-size:18px}.article{padding:22px 18px}}
</style>
</head>

<script src="/assets/tetstack.js"></script>
<script>
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function buildMeta(log){
  const tags = (log.category || 'Systems').split(',').map(t => t.trim()).filter(Boolean);
  return '<div class="lcd-mini"><span class="lcd-lbl">DATE</span><span class="seg">' + escapeHtml(log.date || '—') + '</span><span class="lcd-lbl">READ</span><span class="seg">' + escapeHtml(String(log.readTime || '?')) + ' MIN</span></div>' +
    '<div class="log-tags">' + tags.map((t, i) => '<span class="log-tag' + (i === 0 ? ' primary' : '') + '">' + escapeHtml(t) + '</span>').join('') + '</div>';
}
function titleHTML(t){
  const s = String(t || 'untitled log');
  if (/\*[^*]+\*/.test(s)) return escapeHtml(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const i = s.lastIndexOf(' ');
  if (i < 6 || s.length > 48) return escapeHtml(s);
  return escapeHtml(s.slice(0, i + 1)) + '<em>' + escapeHtml(s.slice(i + 1)) + '</em>';
}
let tocLinks = [];
function buildTOC(root){
  const headings = root.querySelectorAll('h2, h3');
  const tocList = document.getElementById('toc-list');
  if (!headings.length){ tocList.innerHTML = '<li class="side-empty">no sections</li>'; return; }
  tocList.innerHTML = '';
  headings.forEach((h, i) => {
    const id = 'sec-' + i;
    h.id = id;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'toc-item' + (h.tagName === 'H3' ? ' is-sub' : '');
    a.href = '#' + id;
    a.textContent = h.textContent.replace(/^[#\s]+/, '').trim();
    a.addEventListener('click', e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth', block: 'start' }); history.replaceState(null, '', '#' + id); });
    li.appendChild(a);
    tocList.appendChild(li);
    tocLinks.push([h, a]);
  });
}
function bindProgress(){
  const fill = document.getElementById('read-fill'), bar = document.getElementById('read-bar');
  const pct = document.getElementById('read-pct'), hud = document.getElementById('hud-read');
  function update(){
    const h = document.documentElement;
    const total = h.scrollHeight - h.clientHeight;
    const p = total > 0 ? Math.min(1, Math.max(0, h.scrollTop / total)) : 0;
    const v = Math.round(p * 100), txt = String(v).padStart(3, '0') + '%';
    fill.style.width = v + '%';
    bar.style.width = v + '%';
    pct.textContent = txt;
    hud.textContent = txt;
    let cur = null;
    tocLinks.forEach(([hd, a]) => { if (hd.getBoundingClientRect().top < 140) cur = a; });
    tocLinks.forEach(([, a]) => a.classList.toggle('on', a === cur));
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
  return update;
}
async function loadActiveLog(refresh){
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id){ window.location.href = '/'; return; }
  document.getElementById('log-path').textContent = '~/root/logs/' + id;
  try {
    const res = await fetch('/posts/' + encodeURIComponent(id) + '.json');
    if (!res.ok) throw new Error('not found');
    const log = await res.json();
    document.title = String(log.title || 'Log').replace(/\*/g, '') + ' — TETSTACK';
    document.getElementById('post-title').innerHTML = titleHTML(log.title);
    document.getElementById('log-meta').innerHTML = buildMeta(log);
    const contentEl = document.getElementById('post-content');
    contentEl.innerHTML = marked.parse(log.content || '');
    contentEl.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
    buildTOC(contentEl);
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  } catch (e){
    document.title = 'FATAL: LOG UNRESOLVED — TETSTACK';
    document.getElementById('post-title').innerHTML = 'Log <em>unresolved.</em>';
    document.getElementById('log-meta').innerHTML = '<div class="lcd-mini"><span class="lcd-lbl">STATUS</span><span class="seg">SIGNAL LOST</span></div>';
    document.getElementById('post-content').innerHTML = '<div class="fatal">[!] Specified kernel documentation segment could not be located on the filesystem host cluster.</div>';
  }
  refresh();
}
document.addEventListener('DOMContentLoaded', () => { loadActiveLog(bindProgress()); });
</script>
