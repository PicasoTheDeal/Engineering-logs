<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Log View</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{
  --white:#ffffff;
  --lime-cream:#e7ff8d;
  --chartreuse:#ceff1a;
  --forest-moss:#67800d;
  --black:#000000;

  --bg:#000000;
  --fg:#ffffff;
  --fg-dim:rgba(255,255,255,.62);
  --fg-faint:rgba(255,255,255,.36);
  --fg-ghost:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.14);
  --line-hi:rgba(255,255,255,.34);

  --font-mono:'JetBrains Mono','SF Mono','Cascadia Code','Consolas',monospace;
  --font-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-pixel:'Press Start 2P',system-ui;

  --ease:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html{background:var(--bg);font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-mono);
  font-weight:400;
  line-height:1.6;
  letter-spacing:-.005em;
}

::selection{background:var(--chartreuse); color:var(--black);}

#bg-canvas{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.85;}

.read-progress{
  position:fixed; top:0; left:0; right:0;
  height:2px;
  background:rgba(255,255,255,.05);
  z-index:75;
}
.read-progress-fill{
  height:100%; width:0;
  background:var(--chartreuse);
  box-shadow:0 0 12px rgba(206,255,26,.75);
  transition:width .12s linear;
}

.topbar{
  position:fixed; top:0; left:0; right:0; z-index:65;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px clamp(20px,3vw,52px);
  pointer-events:none;
  mix-blend-mode:difference;
}
.wordmark{
  font-family:var(--font-pixel);
  font-size:.7rem;
  letter-spacing:.04em;
  color:var(--white);
  text-decoration:none;
  pointer-events:auto;
}
.wordmark .dot{color:var(--chartreuse);}
.wordmark .slash{color:rgba(255,255,255,.35); margin:0 3px; font-family:var(--font-mono); font-weight:400;}
.top-meta{
  display:flex; align-items:center; gap:14px;
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
}
.top-meta .sep{color:rgba(255,255,255,.2);}
.top-meta .live-tick{
  display:inline-block; width:5px; height:5px;
  background:var(--chartreuse);
  margin-right:7px;
  vertical-align:middle;
  animation:tick 2s steps(2,start) infinite;
}
@keyframes tick{0%,49%{opacity:1;}50%,100%{opacity:.15;}}

.page-wrapper{
  position:relative;
  z-index:2;
  max-width:1180px;
  margin:0 auto;
  padding:clamp(96px,13vh,140px) clamp(24px,4.5vw,80px) 80px;
}

.back-link{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--fg-dim);
  text-decoration:none;
  padding-bottom:3px;
  margin-bottom:34px;
  transition:color .3s var(--ease);
}
.back-link i{font-size:.82rem; color:var(--fg-faint); transition:color .3s var(--ease), transform .35s var(--ease);}
.back-link::after{
  content:'';
  position:absolute; left:0; bottom:0;
  width:100%; height:1px;
  background:var(--chartreuse);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .45s var(--ease);
}
.back-link:hover{color:var(--white);}
.back-link:hover i{color:var(--chartreuse); transform:translateX(-3px);}
.back-link:hover::after{transform:scaleX(1);}

.log-head{
  border:1px solid var(--line);
  background:var(--black);
  margin-bottom:clamp(40px,6vh,64px);
}
.log-head-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:12px 18px;
  border-bottom:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.06em;
  color:var(--fg-faint);
}
.log-head-bar .lhb-path{color:var(--fg-dim);}
.log-head-bar .lhb-path::before{content:'$ cat '; color:var(--forest-moss);}
.log-head-bar .lhb-id{
  display:flex; align-items:center; gap:8px;
  color:var(--chartreuse);
  letter-spacing:.14em;
  text-transform:uppercase;
  font-size:.55rem;
}
.log-head-bar .lhb-id::before{
  content:'';
  display:inline-block;
  width:5px; height:5px;
  background:var(--chartreuse);
  animation:tick 2s steps(2,start) infinite;
}

.log-head-body{padding:clamp(24px,4vh,36px) clamp(22px,3vw,34px);}

.log-title{
  font-family:var(--font-mono);
  font-size:clamp(1.5rem,3.4vw,2.6rem);
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.12;
  color:var(--white);
  margin-bottom:26px;
}
.log-title .caret{
  display:inline-block;
  width:.42em; height:.9em;
  background:var(--chartreuse);
  vertical-align:-.05em;
  margin-left:6px;
  animation:caret 1.1s steps(2,start) infinite;
}
@keyframes caret{0%,49%{opacity:1;}50%,100%{opacity:0;}}

.log-meta{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:6px 22px;
  font-family:var(--font-mono);
  font-size:.68rem;
  letter-spacing:.02em;
  max-width:640px;
}
.log-meta dt{
  color:var(--fg-faint);
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:.55rem;
  align-self:center;
}
.log-meta dd{color:var(--fg-dim);}
.log-meta dd .tag{
  display:inline-block;
  font-size:.55rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--chartreuse);
  border:1px solid rgba(206,255,26,.35);
  padding:2px 8px;
  margin-right:6px;
}
.log-meta dd .tag.sub{color:var(--fg-dim); border-color:var(--line);}

.content-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 240px;
  gap:clamp(32px,4vw,64px);
  align-items:start;
}

#post-content{
  font-family:var(--font-mono);
  font-size:.88rem;
  line-height:1.85;
  color:var(--fg-dim);
  letter-spacing:-.003em;
  min-width:0;
}

#post-content > *:first-child{margin-top:0;}

#post-content h1,
#post-content h2,
#post-content h3,
#post-content h4{
  font-family:var(--font-mono);
  font-weight:600;
  letter-spacing:-.025em;
  color:var(--white);
  line-height:1.2;
  margin-top:52px;
  margin-bottom:16px;
  position:relative;
  scroll-margin-top:90px;
}
#post-content h1::before,
#post-content h2::before{
  content:'#';
  color:var(--chartreuse);
  font-weight:500;
  margin-right:12px;
  opacity:.85;
}
#post-content h1{font-size:1.75rem; padding-bottom:14px; border-bottom:1px solid var(--line);}
#post-content h2{font-size:1.4rem; padding-bottom:12px; border-bottom:1px solid var(--line);}
#post-content h3{font-size:1.1rem;}
#post-content h3::before{content:'##'; color:var(--chartreuse); font-weight:500; margin-right:10px; opacity:.6; font-size:.85em;}
#post-content h4{font-size:.98rem;}
#post-content h4::before{content:'###'; color:var(--chartreuse); font-weight:500; margin-right:9px; opacity:.45; font-size:.82em;}

#post-content p{
  color:var(--fg-dim);
  margin-bottom:20px;
  max-width:74ch;
}

#post-content a{
  color:var(--lime-cream);
  text-decoration:none;
  border-bottom:1px solid rgba(206,255,26,.4);
  transition:color .3s var(--ease), border-color .3s var(--ease);
}
#post-content a:hover{
  color:var(--chartreuse);
  border-bottom-color:var(--chartreuse);
}

#post-content strong{color:var(--white); font-weight:600;}
#post-content em{font-style:italic; color:var(--lime-cream);}

#post-content ul,
#post-content ol{
  margin:0 0 22px 0;
  padding-left:24px;
  max-width:74ch;
}
#post-content ul li,
#post-content ol li{
  color:var(--fg-dim);
  margin-bottom:8px;
  padding-left:6px;
}
#post-content ul li::marker{color:var(--chartreuse);}
#post-content ol li::marker{color:var(--chartreuse); font-weight:600;}

#post-content blockquote{
  border-left:2px solid var(--chartreuse);
  padding:8px 0 8px 22px;
  margin:26px 0;
  color:var(--fg-dim);
  font-style:italic;
  max-width:72ch;
}
#post-content blockquote p{margin-bottom:0; color:var(--fg-dim);}

#post-content code{
  font-family:var(--font-mono);
  font-size:.85em;
  color:var(--chartreuse);
  background:rgba(206,255,26,.08);
  padding:2px 6px;
  border:1px solid rgba(206,255,26,.15);
}

#post-content pre{
  position:relative;
  background:#000;
  border:1px solid var(--line-hi);
  padding:44px 20px 18px;
  overflow-x:auto;
  margin:0 0 26px 0;
  line-height:1.75;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
#post-content pre::before{
  content:'// CODE';
  position:absolute;
  top:12px; left:16px;
  font-family:var(--font-mono);
  font-size:.52rem;
  letter-spacing:.22em;
  color:var(--fg-dim);
}
#post-content pre::after{
  content:'';
  position:absolute;
  top:16px; right:16px;
  width:6px; height:6px;
  background:var(--chartreuse);
  border-radius:50%;
  box-shadow:0 0 10px rgba(206,255,26,.7);
}
#post-content pre::-webkit-scrollbar{height:8px;}
#post-content pre::-webkit-scrollbar-track{background:transparent;}
#post-content pre::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);}
#post-content pre code{
  color:var(--fg);
  background:transparent;
  border:none;
  padding:0;
  font-size:.82rem;
}

#post-content hr{
  border:none;
  height:1px;
  background:var(--line);
  margin:44px 0;
}

#post-content img{
  max-width:100%;
  height:auto;
  display:block;
  border:1px solid var(--line);
  margin:26px 0;
}

#post-content table{
  width:100%;
  border-collapse:collapse;
  margin:0 0 26px 0;
  font-size:.78rem;
}
#post-content th,
#post-content td{
  border:1px solid var(--line);
  padding:10px 14px;
  text-align:left;
}
#post-content th{
  background:rgba(255,255,255,.03);
  color:var(--white);
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-size:.62rem;
}
#post-content td{color:var(--fg-dim);}

#post-content .fatal{
  border:1px solid var(--lime-cream);
  color:var(--lime-cream);
  padding:24px;
  font-size:.78rem;
  letter-spacing:.04em;
  background:rgba(231,255,141,.04);
}

.post-side{
  position:sticky;
  top:88px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.side-card{
  border:1px solid var(--line);
  background:var(--black);
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  transition:border-color .3s var(--ease);
  width:fit-content;
}
.side-card:hover{border-color:var(--line-hi);}

.side-label{
  font-family:var(--font-mono);
  font-size:.52rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--chartreuse);
  display:flex;
  align-items:center;
  gap:8px;
}
.side-label::before{
  content:'';
  display:inline-block;
  width:4px; height:4px;
  background:var(--chartreuse);
  animation:tick 2s steps(2,start) infinite;
}

.progress-ring{
  display:flex;
  align-items:center;
  gap:14px;
}
.progress-ring svg{
  width:52px; height:52px;
  flex-shrink:0;
  transform:rotate(-90deg);
}
.progress-ring .pr-track{fill:none; stroke:rgba(255,255,255,.08); stroke-width:3;}
.progress-ring .pr-fill{
  fill:none;
  stroke:var(--chartreuse);
  stroke-width:3;
  stroke-linecap:round;
  stroke-dasharray:138.2;
  stroke-dashoffset:138.2;
  transition:stroke-dashoffset .18s linear;
  filter:drop-shadow(0 0 6px rgba(206,255,26,.6));
}
.progress-ring .pr-num{
  font-family:var(--font-mono);
  font-size:1.1rem;
  font-weight:600;
  color:var(--white);
  line-height:1;
}
.progress-ring .pr-lbl{
  font-family:var(--font-mono);
  font-size:.52rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--fg-faint);
  margin-top:2px;
  display:block;
}

.toc-list{
  display:flex;
  flex-direction:column;
  gap:2px;
  list-style:none;
  font-family:var(--font-mono);
  font-size:.68rem;
}
.toc-item{
  color:var(--fg-dim);
  text-decoration:none;
  padding:5px 0 5px 12px;
  border-left:1px solid transparent;
  transition:all .3s var(--ease);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.toc-item:hover{
  color:var(--chartreuse);
  border-left-color:var(--chartreuse);
  padding-left:16px;
}
.toc-item.is-sub{padding-left:24px; font-size:.62rem; color:var(--fg-faint);}
.toc-item.is-sub:hover{padding-left:28px;}

.side-empty{
  font-family:var(--font-mono);
  font-size:.62rem;
  color:var(--fg-faint);
  letter-spacing:.04em;
}

.post-footer{
  border-top:1px solid var(--line);
  margin-top:60px;
  padding-top:24px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  font-family:var(--font-mono);
  font-size:.58rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--fg-faint);
}
.post-footer .brand-mark{color:var(--lime-cream);}
.post-footer a{
  color:var(--fg-dim);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .3s, border-color .3s;
}
.post-footer a:hover{color:var(--chartreuse); border-bottom-color:var(--chartreuse);}

@media (max-width:900px){
  .content-grid{grid-template-columns:1fr;}
  .post-side{position:static; order:-1; flex-direction:row; flex-wrap:wrap;}
  .post-side .side-card{flex:1 1 220px;}
}

@media (max-width:680px){
  .top-meta{display:none;}
  .page-wrapper{padding-top:96px;}
  #post-content{font-size:.82rem;}
  #post-content pre{padding:40px 14px 14px;}
  #post-content pre code{font-size:.74rem;}
  #post-content h1{font-size:1.4rem;}
  #post-content h2{font-size:1.15rem;}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="read-progress" aria-hidden="true">
  <div class="read-progress-fill" id="read-fill"></div>
</div>

<header class="topbar" aria-label="Site header">
  <a href="/" class="wordmark">TETSTACK<span class="dot">.</span><span class="slash">/</span>LOGS</a>
  <span class="top-meta">
    <span><span class="live-tick"></span>single log</span>
    <span class="sep">/</span>
    <span id="log-path">~/root/logs</span>
  </span>
</header>

<div class="page-wrapper">
  <a href="/" class="back-link">
    <i class="bi bi-arrow-left"></i>
    tail -f ~/root/logs
  </a>

  <header class="log-head" aria-label="Log metadata">
    <div class="log-head-bar">
      <span class="lhb-path" id="lh-path">~/root/logs/pending.json</span>
      <span class="lhb-id">resolving…</span>
    </div>
    <div class="log-head-body">
      <h1 class="log-title" id="post-title">Resolving mapping descriptor<span class="caret"></span></h1>
      <dl class="log-meta" id="log-meta"></dl>
    </div>
  </header>

  <div class="content-grid">
    <main id="post-content" aria-label="Log content"></main>

    <aside class="post-side" aria-label="Reading aids">
      <div class="side-card">
        <span class="side-label">Reading</span>
        <div class="progress-ring">
          <svg viewBox="0 0 52 52" aria-hidden="true">
            <circle class="pr-track" cx="26" cy="26" r="22"/>
            <circle class="pr-fill" id="ring-fill" cx="26" cy="26" r="22"/>
          </svg>
          <div>
            <span class="pr-num" id="read-pct">0%</span>
            <span class="pr-lbl">progress</span>
          </div>
        </div>
      </div>

      <div class="side-card" id="toc-card">
        <span class="side-label">Contents</span>
        <ul class="toc-list" id="toc-list">
          <li class="side-empty">no sections</li>
        </ul>
      </div>
    </aside>
  </div>

  <footer class="post-footer">
    <span><span class="brand-mark">PicasoTheDeal</span> © 2026</span>
    <span><a href="/">← back to stream</a></span>
  </footer>
</div>

<script>
(function initBackground(){
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  const spacing = 46;
  let mx = -99999, my = -99999;
  window.addEventListener('mousemove', (e) => {
    mx = e.clientX * dpr;
    my = e.clientY * dpr;
  });
  window.addEventListener('mouseleave', () => { mx = my = -99999; });

  let t = 0;
  function draw(){
    t += 0.006;
    ctx.clearRect(0, 0, W, H);

    const s = spacing * dpr;
    const cols = Math.ceil(W / s) + 2;
    const rows = Math.ceil(H / s) + 2;
    const touch = 190 * dpr;

    for (let i = -1; i < cols; i++){
      for (let j = -1; j < rows; j++){
        const x = i * s;
        const y = j * s + Math.sin(t + i * 0.35 + j * 0.12) * 5 * dpr;
        const dx = x - mx, dy = y - my;
        const d = Math.sqrt(dx * dx + dy * dy);
        const prox = Math.max(0, 1 - d / touch);

        const baseA = 0.07;
        const a = baseA + prox * 0.72;
        const r = (0.9 + prox * 1.9) * dpr;

        if (prox > 0.04){
          ctx.fillStyle = 'rgba(206,255,26,' + (prox * 0.9).toFixed(3) + ')';
        } else {
          ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function buildMetaList(log){
  const tags = (log.category || 'Systems').split(',').map(t => t.trim()).filter(Boolean);
  const tagsHTML = tags.length
    ? tags.map((t, i) => '<span class="tag' + (i === 0 ? '' : ' sub') + '">' + escapeHtml(t) + '</span>').join('')
    : '<span class="tag">Untagged</span>';

  const date = escapeHtml(log.date || '—');
  const read = escapeHtml(String(log.readTime || '?'));

  return (
    '<dt>date</dt><dd>' + date + '</dd>' +
    '<dt>tags</dt><dd>' + tagsHTML + '</dd>' +
    '<dt>read</dt><dd>' + read + ' min</dd>'
  );
}

function buildTOC(root){
  const headings = root.querySelectorAll('h2, h3');
  const tocList = document.getElementById('toc-list');
  if (!headings.length){
    tocList.innerHTML = '<li class="side-empty">no sections</li>';
    return;
  }
  tocList.innerHTML = '';
  headings.forEach((h, i) => {
    const id = 'sec-' + i;
    h.id = id;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'toc-item' + (h.tagName === 'H3' ? ' is-sub' : '');
    a.href = '#' + id;
    a.textContent = h.textContent.replace(/^[#\s]+/, '').trim();
    a.addEventListener('click', (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + id);
    });
    li.appendChild(a);
    tocList.appendChild(li);
  });
}

function bindProgress(){
  const fill = document.getElementById('read-fill');
  const ring = document.getElementById('ring-fill');
  const pct  = document.getElementById('read-pct');
  const RING_LEN = 138.2;

  function update(){
    const h = document.documentElement;
    const total = h.scrollHeight - h.clientHeight;
    const p = total > 0 ? Math.min(1, Math.max(0, h.scrollTop / total)) : 0;
    const pctVal = Math.round(p * 100);

    if (fill) fill.style.width = (pctVal) + '%';
    if (ring) ring.style.strokeDashoffset = String(RING_LEN * (1 - p));
    if (pct)  pct.textContent = pctVal + '%';
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
}

async function loadActiveLog(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (!id){
    window.location.href = '/';
    return;
  }

  const pathEl = document.getElementById('lh-path');
  if (pathEl) pathEl.textContent = '~/root/logs/' + id + '.json';

  try {
    const res = await fetch('/posts/' + encodeURIComponent(id) + '.json');
    if (!res.ok) throw new Error('not found');

    const log = await res.json();

    document.title = (log.title || 'Log') + ' — PicasoTheDealer';
    document.getElementById('post-title').innerHTML =
      escapeHtml(log.title || 'untitled log') + '<span class="caret"></span>';
    document.getElementById('log-meta').innerHTML = buildMetaList(log);

    const contentEl = document.getElementById('post-content');
    contentEl.innerHTML = marked.parse(log.content || '');

    buildTOC(contentEl);

    const pathBadge = document.querySelector('.lhb-id');
    if (pathBadge) pathBadge.textContent = 'loaded';

    const logPathTop = document.getElementById('log-path');
    if (logPathTop) logPathTop.textContent = '~/root/logs/' + id;

  } catch (e){
    document.title = 'FATAL: LOG UNRESOLVED';
    document.getElementById('post-title').innerHTML =
      'FATAL: LOG UNRESOLVED<span class="caret"></span>';
    document.getElementById('log-meta').innerHTML =
      '<dt>status</dt><dd><span class="tag">signal lost</span></dd>' +
      '<dt>date</dt><dd>—</dd>';
    document.getElementById('post-content').innerHTML =
      '<div class="fatal">[!] Specified kernel documentation segment could not be located on the filesystem host cluster.</div>';

    const pathBadge = document.querySelector('.lhb-id');
    if (pathBadge) pathBadge.textContent = 'not found';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  bindProgress();
  loadActiveLog();
});
</script>
